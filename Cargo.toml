[workspace]
resolver = "3"
members = [
    "crates/model",
    "crates/surface",
    "crates/ui",
    "crates/host",
    "crates/tty_host",
    "crates/engine",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.metadata.app]
display_name = "BS Mail"
tagline = "Mail for Power Users"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Third-party crates, with the stage that first uses each. Members inherit
# from here with `workspace = true`; internal crates use path dependencies.
[workspace.dependencies]
# Stage 1: config and theme data types (model), embedded theme loading.
serde = { version = "1", features = ["derive"] }
# Stage 1: parsing the embedded default theme and, later, config files.
toml = "0.9" # verify: version not checked against the registry
# Options screen: changing one setting in config.toml and leaving the rest of the file as it is (app).
toml_edit = { version = "0.25.19", default-features = false, features = ["parse", "display"] }
# Stage 1: cell buffer, rect, style and color types behind surface/src/frame.rs.
ratatui-core = { version = "0.1", default-features = false } # verify: split out of the 0.30 widget crate
# Stage 1: the window and its input events (host).
winit = "0.30.13"
# Stage 1: CPU presentation of the pixel buffer (host).
softbuffer = "0.4.8"
# Stage 1: glyph rasterizing from the embedded fonts (host).
swash = "0.2.10"
# Stage 1: rounded shapes, lines and gradients (host).
tiny-skia = "0.12.0"
# Stage 1: cell widths for layout and painting (ui, host).
unicode-width = "0.2" # verify: version not checked against the registry
# Stage 1: grapheme splitting for cells (ui, host).
unicode-segmentation = "1" # verify: version not checked against the registry
# Stage 1: frame-to-image output for --render-once and snapshots (host).
png = "0.18" # verify: version not checked against the registry
# Stage 4: the terminal's size, raw mode and input events (tty_host).
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste"] }
# Stage 5: async runtime for the mail worker thread (engine).
tokio = { version = "1.54", default-features = false, features = ["rt", "net", "time", "sync", "io-util", "macros"] }
# Stage 5: IMAP client over any async stream (engine).
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
# Stage 5: TLS for the IMAP connection, ring provider so no C toolchain is needed (engine).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Stage 5: TLS stream adapter, used for implicit TLS and after STARTTLS (engine).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Stage 5: bundled root certificates, the same on every platform (engine).
webpki-roots = "1"
# Stage 9: the SHA-256 for the sign-in link's PKCE challenge; already in the tree through the TLS crate (engine).
ring = { version = "0.17.14", default-features = false }
# Stage 5: MIME parsing and charset decoding; 1.x needs a newer compiler than the pinned one (engine).
mail-parser = "0.11"
# Stage 5: HTML bodies to wrapped text with numbered link references (engine).
html2text = { version = "0.17", default-features = false }
# Stage 5: consuming the IMAP client's response streams (engine).
futures-util = { version = "0.3", default-features = false }
# Stage 5: the local time zone, so Today and Yesterday turn over at local midnight (app).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Stage 8: the system clipboard, for copy and paste in the composer (host).
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
# Stage 4: leaving the terminal in good order when it is hung up or told to stop (tty_host).
signal-hook = { version = "0.3", default-features = false }
