# The high-contrast theme: pure black and white with two accents, yellow and
# cyan. It inherits the default theme and replaces its palette, so every role
# keeps its meaning; every text color is at least 7:1 against its background
# (a test checks it). With only two accents, danger is also underlined, so it
# never rests on color alone.

name = "high-contrast"
inherits = "neon-night"

[palette]
bg         = "#000000"
bg_raised  = "#262626"   # menus, dialogs, hover row
border     = "#ffffff"
text       = "#ffffff"
text_dim   = "#c8c8c8"
green      = "#ffff00"
green_hi   = "#ffff00"
lime       = "#ffff00"
mint       = "#ffff00"
cyan       = "#00ffff"
cyan_hi    = "#00ffff"
ice        = "#00ffff"
blue       = "#00ffff"
blue_sel   = "#0000c0"   # selected message row: white, yellow and cyan all read on it
keycap     = "#00ffff"
yellow     = "#ffff00"
lemon      = "#ffff00"
orange     = "#ffff00"
red        = "#ffff00"
magenta    = "#00ffff"
on_accent  = "#000000"
link_hover   = "#00ffff"   # the link under the pointer: a cyan block
link_pressed = "#ffffff"   # the button is down on it: a white block
link_focus   = "#262626"   # the link the keys are on: bold yellow text on a dark band
blue_dim     = "#404040"   # the selected message's bar while the keys are in another pane: grey, white text 10.4:1, 2:1 against the page
green_dim    = "#404040"   # the selected folder's bar while the keys are in another pane: the same grey

[roles]
# The three states of a link are told apart by more than one color. The pointer's
# are blocks with black text, bold and underlined: hovered on cyan (16.8:1),
# pressed on white (21:1). The keyboard's is bold yellow text on a dark band
# (14.1:1), also underlined. `ice` and `cyan` are the same color here and the
# default theme's teal and plum are no accents of this one, so each state is
# written out. Nothing else is yellow text on a dark band: the find's matches are
# black on yellow and the selection is on blue.
"body.link.hover"        = { fg = "on_accent", bg = "link_hover", bold = true, underline = true }
"body.link.pressed"      = { fg = "on_accent", bg = "link_pressed", bold = true, underline = true }
"body.link.focus"        = { fg = "yellow", bg = "link_focus", bold = true, underline = true }
# The pane that has the keys is told from the others by more than color. Its
# title is cyan, the other accent (the titles are yellow), bold and underlined.
# Its selection bar keeps the theme's block and bold text; the bar of a pane
# that does not have the keys is a grey band with regular weight text, white on
# #404040 at 10.4:1 (every accent on it reads at 8.3:1 or better).
"title.focused"          = { fg = "cyan", bold = true }
"list.selected.unfocused" = { fg = "text", bg = "blue_dim", bold = false }
"sidebar.selected.unfocused" = { fg = "text", bg = "green_dim", bold = false }
"footer.error"           = { underline = true }
"reader.found.current"   = { underline = true }
"strip.offline"          = { underline = true }
"subject.warning"        = { underline = true }
"subject.tag.alert"      = { underline = true }

[ansi16]
bg        = "black"
bg_raised = "black"
text      = "bright-white"
text_dim  = "white"
border    = "bright-white"
green     = "bright-yellow"
green_hi  = "bright-yellow"
lime      = "bright-yellow"
mint      = "bright-yellow"
cyan      = "bright-cyan"
cyan_hi   = "bright-cyan"
ice       = "bright-cyan"
blue_sel  = "blue"
keycap    = "bright-cyan"
yellow    = "bright-yellow"
lemon     = "bright-yellow"
orange    = "bright-yellow"
red       = "bright-yellow"
magenta   = "bright-cyan"
on_accent = "black"
link_hover   = "bright-cyan"
link_pressed = "bright-white"
link_focus   = "black"
blue_dim     = "blue"
green_dim    = "blue"
